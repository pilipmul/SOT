<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly Work Meeting - SOT</title>

  <!-- PROTEKSI LOGIN INSTAN SEBELUM ELEMEN TAMPILAN DIDERENDER -->
  <script>
    (function checkAuth() {
      const userSessionString = localStorage.getItem("user");
      
      if (!userSessionString) {
        window.location.replace("login.html");
        return;
      }

      try {
        const userData = JSON.parse(userSessionString);
        if (!userData || !userData.akses || userData.akses.RKM !== "Y") {
          window.location.replace("https://pilipmul.github.io/SOT/dashboard.html");
        }
      } catch (err) {
        window.location.replace("login.html");
      }
    })();
  </script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; font-family: sans-serif; }
    .card { border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    .table-responsive { max-height: 70vh; overflow-y: auto; overflow-x: auto; }
    .hidden { display: none !important; }

    /* Header Center & Styling Filter Header */
    th.th-header-center {
      text-align: center !important;
      vertical-align: middle;
      white-space: nowrap;
    }
    .btn-filter-header {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.65rem;
      margin-left: 4px;
      padding: 2px 4px;
      cursor: pointer;
      opacity: 0.75;
      transition: opacity 0.2s ease, color 0.2s ease;
      vertical-align: middle;
    }
    .btn-filter-header:hover, .btn-filter-header.active {
      opacity: 1;
      color: #ffc107;
    }

    /* Menu Dropdown Filter */
    .filter-dropdown-menu {
      min-width: 220px;
      padding: 10px;
      font-size: 0.875rem;
    }

    /* Pemaksaan Warna Baris */
    tr.row-done td { background-color: #00ff00 !important; color: #000000 !important; }
    tr.row-close td { background-color: #808080 !important; color: #ffffff !important; }

    /* Style Tombol Status Edit */
    .btn-status-edit {
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }
    .btn-status-edit:hover {
      transform: scale(1.08);
      opacity: 0.85;
    }

    /* CUSTOM TAG INPUT STYLE UNTUK PIC */
    .pic-tag-container {
      border: 1px solid #dee2e6;
      border-radius: 6px;
      padding: 6px;
      background-color: #fff;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      min-height: 42px;
    }
    .pic-tag-container:focus-within {
      border-color: #86b7fe;
      box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
    }
    .pic-tag {
      background-color: #0d6efd;
      color: #fff;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .pic-tag .btn-remove {
      cursor: pointer;
      font-weight: bold;
      line-height: 1;
      opacity: 0.8;
    }
    .pic-tag .btn-remove:hover {
      opacity: 1;
      color: #ffc107;
    }
    .pic-input-search {
      border: none;
      outline: none;
      flex-grow: 1;
      min-width: 120px;
      padding: 2px 4px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

<div class="container-fluid py-4">
  <div class="card bg-white p-4">
    <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
      <div class="d-flex align-items-center gap-3">
        <a href="https://pilipmul.github.io/SOT/dashboard.html" class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-left" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8"/>
          </svg>
          Back
        </a>
        <div>
          <h3 class="fw-bold mb-0">Rapat Kerja Mingguan (RKM)</h3>
          <p class="text-muted mb-0">Active User: <span id="txtCurrentUser" class="fw-bold text-primary">-</span></p>
        </div>
      </div>
      <button id="btnTambah" class="btn btn-success hidden" onclick="openModal()">
        + New
      </button>
    </div>

    <!-- TABEL RINGKAS 7 KOLOM DENGAN HEADER CENTER & FILTER POPUP -->
    <div class="table-responsive">
      <table class="table table-bordered align-middle border">
        <thead class="table-dark sticky-top">
          <tr>
            <th class="th-header-center">
              Tanggal
              <button class="btn-filter-header" onclick="toggleFilterMenu(event, 'tanggal')">▼</button>
            </th>
            <th class="th-header-center">
              Sumber
              <button class="btn-filter-header" onclick="toggleFilterMenu(event, 'sumber')">▼</button>
            </th>
            <th class="th-header-center">
              Case
              <button class="btn-filter-header" onclick="toggleFilterMenu(event, 'case')">▼</button>
            </th>
            <th class="th-header-center">
              PIC
              <button class="btn-filter-header" onclick="toggleFilterMenu(event, 'pic')">▼</button>
            </th>
            <th class="th-header-center">
              Update
              <button class="btn-filter-header" onclick="toggleFilterMenu(event, 'update')">▼</button>
            </th>
            <th class="th-header-center">
              Target
              <button class="btn-filter-header" onclick="toggleFilterMenu(event, 'target')">▼</button>
            </th>
            <th class="th-header-center">
              Status
            </th>
          </tr>
        </thead>
        <tbody id="rkmTableBody">
          <tr>
            <td colspan="7" class="text-center text-muted py-4">Loading RKM data...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- DROPDOWN MENU TEMPLATE FOR SORT & FILTER -->
<div id="filterDropdown" class="dropdown-menu shadow filter-dropdown-menu" style="display: none; position: absolute; z-index: 1050;">
  <div class="d-flex flex-column gap-2">
    <div class="fw-bold text-secondary border-bottom pb-1" id="filterHeaderTitle">Filter Column</div>
    <button class="btn btn-sm btn-outline-primary text-start" onclick="applySort('asc')">
      ▲ Sort A-Z
    </button>
    <button class="btn btn-sm btn-outline-primary text-start" onclick="applySort('desc')">
      ▼ Sort Z-A
    </button>
    <hr class="my-1">
    <label class="form-label mb-0 small fw-semibold">Filter Search:</label>
    <input type="text" id="filterSearchInput" class="form-control form-control-sm" placeholder="Type to filter..." oninput="applyTextFilter()">
    <button class="btn btn-sm btn-link text-danger text-end p-0 mt-1" onclick="clearColumnFilter()">Clear Filter</button>
  </div>
</div>

<!-- MODAL FORM EDIT / ADD -->
<div class="modal fade" id="rkmModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="modalTitle">Add New Agenda</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="rkmForm">
          <input type="hidden" id="inpRowNum">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">Tanggal</label>
              <input type="text" id="inpTanggal" class="form-control" placeholder="Contoh: 17 Jun 26" required>
            </div>
            <div class="col-md-8">
              <label class="form-label fw-semibold">Sumber</label>
              <input type="text" id="inpSumber" class="form-control" required>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Case (Rencana & Kendala)</label>
              <textarea id="inpCase" class="form-control" rows="3" required></textarea>
            </div>
            
            <!-- ISIAN PIC INTERAKTIF -->
            <div class="col-md-6">
              <label class="form-label fw-semibold">PIC</label>
              <div class="pic-tag-container" id="picTagContainer" onclick="focusPicInput()">
                <input type="text" id="inpPicSearch" class="pic-input-search" placeholder="Ketik PIC..." list="picDatalist" oninput="handlePicSelect(this)">
              </div>
              <small class="text-muted">Ketik nama PIC untuk memilih dari daftar opsi.</small>

              <datalist id="picDatalist">
                <option value="GA"></option>
                <option value="Head Ops."></option>
                <option value="ME"></option>
                <option value="TRO"></option>
                <option value="FA"></option>
                <option value="Head FA"></option>
                <option value="Security"></option>
                <option value="All"></option>
                <option value="CS"></option>
                <option value="Kasir"></option>
                <option value="MKT"></option>
              </datalist>
            </div>

            <div class="col-md-6">
              <label class="form-label fw-semibold">Target Selesai</label>
              <input type="text" id="inpTarget" class="form-control" placeholder="Contoh: 20-07-2026 atau W3 Juli">
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Update Progress & Realisasi</label>
              <textarea id="inpUpdate" class="form-control" rows="3"></textarea>
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Status Case</label>
              <select id="inpStatus" class="form-select fw-bold">
                <option value="Open">Open (In Progress)</option>
                <option value="Done" style="background-color: #00ff00; color: #000;">Done (Completed)</option>
                <option value="Close" style="background-color: #808080; color: #fff;">Close (Closed)</option>
              </select>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer d-flex justify-content-between">
        <div>
          <button type="button" id="btnDeleteModal" class="btn btn-danger hidden" onclick="deleteFromModal()">
            Delete
          </button>
        </div>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="submitForm()">Save</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwoz7fGFbbV5kDdKDGCvYxHsJG3Nm5_0KAk-9Nu7kYO05U_FW1MwI8DBch2amyT45pZmQ/exec";
  
  const VALID_PICS = ["GA", "Head Ops.", "ME", "TRO", "FA", "Head FA", "Security", "All", "CS", "Kasir", "MKT"];
  let selectedPicsArray = [];

  let usernameFromStorage = "Tamu";
  try {
    const userData = JSON.parse(localStorage.getItem("user"));
    if (userData && userData.nama) {
      usernameFromStorage = userData.nama;
    }
  } catch (err) {
    console.error("Gagal membaca session:", err);
  }

  const CURRENT_USER = usernameFromStorage;
  let rkmDataCache = [];
  let rkmDataFiltered = [];
  let hasEditAccessGlobal = false;
  let bootstrapModal;

  // Variabel penampung state Sort & Filter Per Kolom
  let activeColumn = null;
  let filtersState = {
    tanggal: "", sumber: "", case: "", pic: "", update: "", target: "", status: ""
  };
  let sortState = { col: null, dir: null };

  document.addEventListener("DOMContentLoaded", () => {
    document.getElementById("txtCurrentUser").innerText = CURRENT_USER;
    bootstrapModal = new bootstrap.Modal(document.getElementById('rkmModal'));
    fetchRKMData();

    // Sembunyikan popup filter jika mengklik area luar
    document.addEventListener("click", (e) => {
      const dropdown = document.getElementById("filterDropdown");
      if (!dropdown.contains(e.target) && !e.target.classList.contains("btn-filter-header")) {
        dropdown.style.display = "none";
      }
    });
  });

  /* LOGIKA MULTI-TAG INPUT UNTUK PIC */
  function focusPicInput() {
    document.getElementById("inpPicSearch").focus();
  }

  function handlePicSelect(input) {
    const val = input.value.trim();
    const match = VALID_PICS.find(p => p.toLowerCase() === val.toLowerCase());

    if (match) {
      if (!selectedPicsArray.includes(match)) {
        selectedPicsArray.push(match);
        renderPicTags();
      }
      input.value = "";
    }
  }

  function removePic(picName) {
    selectedPicsArray = selectedPicsArray.filter(p => p !== picName);
    renderPicTags();
  }

  function renderPicTags() {
    const container = document.getElementById("picTagContainer");
    const inputSearch = document.getElementById("inpPicSearch");

    container.querySelectorAll(".pic-tag").forEach(el => el.remove());

    selectedPicsArray.forEach(pic => {
      const tag = document.createElement("span");
      tag.className = "pic-tag";
      tag.innerHTML = `${pic} <span class="btn-remove" onclick="removePic('${pic}')">&times;</span>`;
      container.insertBefore(tag, inputSearch);
    });
  }

  /* LOGIKA FETCH DATA BACKEND */
  function fetchRKMData() {
    const url = `${WEB_APP_URL}?action=getRKM&currentUser=${encodeURIComponent(CURRENT_USER)}`;
    
    fetch(url)
      .then(res => {
        if (!res.ok) throw new Error("HTTP error status = " + res.status);
        return res.json();
      })
      .then(response => {
        if (response && response.success) {
          rkmDataCache = response.data;
          hasEditAccessGlobal = response.hasEditAccess;
          processDataAndRender();
        } else {
          alert("Gagal memuat data: " + (response ? response.message : "Format data salah"));
        }
      })
      .catch(err => console.error("Detail Error:", err));
  }

  /* FITUR POPUP FILTER & SORTING KOLOM HEADER */
  function toggleFilterMenu(e, columnKey) {
    e.stopPropagation();
    activeColumn = columnKey;
    const dropdown = document.getElementById("filterDropdown");
    
    document.getElementById("filterHeaderTitle").innerText = `Filter: ${columnKey.toUpperCase()}`;
    document.getElementById("filterSearchInput").value = filtersState[columnKey] || "";

    // Tampilkan dropdown terlebih dahulu untuk mendapatkan nilainya
    dropdown.style.display = "block";

    const rect = e.target.getBoundingClientRect();
    const dropdownWidth = dropdown.offsetWidth || 220;
    const windowWidth = window.innerWidth;

    // Hitung posisi left agar tidak terpotong di tepi kiri maupun kanan layar
    let leftPos = rect.left - 180;
    
    // Pastikan tidak melenceng ke sebelah kiri (batas min 10px dari tepi kiri layar)
    if (leftPos < 10) {
      leftPos = Math.max(10, rect.left);
    }
    
    // Pastikan tidak melebihi tepi kanan layar
    if (leftPos + dropdownWidth > windowWidth - 10) {
      leftPos = windowWidth - dropdownWidth - 10;
    }

    dropdown.style.left = `${leftPos}px`;
    dropdown.style.top = `${rect.bottom + window.scrollY + 5}px`;
    
    setTimeout(() => document.getElementById("filterSearchInput").focus(), 100);
  }

  function applySort(direction) {
    sortState = { col: activeColumn, dir: direction };
    processDataAndRender();
    document.getElementById("filterDropdown").style.display = "none";
  }

  function applyTextFilter() {
    const val = document.getElementById("filterSearchInput").value;
    filtersState[activeColumn] = val.toLowerCase();
    processDataAndRender();
  }

  function clearColumnFilter() {
    filtersState[activeColumn] = "";
    document.getElementById("filterSearchInput").value = "";
    if (sortState.col === activeColumn) sortState = { col: null, dir: null };
    processDataAndRender();
    document.getElementById("filterDropdown").style.display = "none";
  }

  /* MEMPROSES FILTER & SORTING DATA TABEL */
  function processDataAndRender() {
    let result = [...rkmDataCache];

    // 1. Jalankan Filter Pencarian Per Kolom
    Object.keys(filtersState).forEach(key => {
      const query = filtersState[key];
      if (query) {
        result = result.filter(item => {
          const val = (item[key] || "").toString().toLowerCase();
          return val.includes(query);
        });
      }
    });

    // 2. Jalankan Sorting Ascending / Descending
    if (sortState.col && sortState.dir) {
      const key = sortState.col;
      const isAsc = sortState.dir === 'asc';
      result.sort((a, b) => {
        const valA = (a[key] || "").toString().toLowerCase();
        const valB = (b[key] || "").toString().toLowerCase();
        return isAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
      });
    }

    rkmDataFiltered = result;
    renderTable(rkmDataFiltered, hasEditAccessGlobal);
  }

  /* RENDER TABEL HASIL PROSES */
  function renderTable(data, hasEditAccess) {
    const tbody = document.getElementById("rkmTableBody");
    tbody.innerHTML = "";

    if (hasEditAccess) {
      document.getElementById("btnTambah").classList.remove("hidden");
    }

    if (data.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" class="text-center text-muted py-3">Tidak ada agenda kerja yang sesuai.</td></tr>`;
      return;
    }

    data.forEach((item) => {
      // Cari index asli data di cache agar modal edit tepat sasaran
      const originalIndex = rkmDataCache.findIndex(d => d.rowNum === item.rowNum);
      const tr = document.createElement("tr");

      if (item.status === "Done") {
        tr.classList.add("row-done");
      } else if (item.status === "Close") {
        tr.classList.add("row-close");
      }

      let statusBadgeClass = "bg-primary";
      if (item.status === "Done" || item.status === "Close") statusBadgeClass = "bg-dark text-white";

      const picBadges = item.pic 
        ? item.pic.split(",").map(p => `<span class="badge bg-secondary me-1 mb-1">${p.trim()}</span>`).join("")
        : '-';

      tr.innerHTML = `
        <td><b>${item.tanggal || '-'}</b></td>
        <td>${item.sumber || '-'}</td>
        <td>${item.case || '-'}</td>
        <td>${picBadges}</td>
        <td>${item.update || '-'}</td>
        <td>${item.target || '-'}</td>
        <td class="text-center">
          ${hasEditAccess ? `
            <span class="badge ${statusBadgeClass} btn-status-edit shadow-sm" onclick="openModal(${originalIndex})" title="Click to edit">
              ${item.status || 'Open'}
            </span>
          ` : `
            <span class="badge ${statusBadgeClass}">${item.status || 'Open'}</span>
          `}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function openModal(index = null) {
    const form = document.getElementById("rkmForm");
    form.reset();
    document.getElementById("inpRowNum").value = "";
    document.getElementById("inpStatus").value = "Open";

    selectedPicsArray = [];
    renderPicTags();

    const btnDelete = document.getElementById("btnDeleteModal");

    if (index !== null) {
      document.getElementById("modalTitle").innerText = "Edit Agenda RKM";
      const item = rkmDataCache[index];
      document.getElementById("inpRowNum").value = item.rowNum;
      document.getElementById("inpTanggal").value = item.tanggal;
      document.getElementById("inpSumber").value = item.sumber;
      document.getElementById("inpCase").value = item.case;
      document.getElementById("inpTarget").value = item.target;
      document.getElementById("inpUpdate").value = item.update;
      document.getElementById("inpStatus").value = item.status || "Open";

      if (item.pic) {
        selectedPicsArray = item.pic.split(",").map(p => p.trim()).filter(p => p !== "");
        renderPicTags();
      }

      btnDelete.classList.remove("hidden");
    } else {
      document.getElementById("modalTitle").innerText = "Add New Agenda";
      btnDelete.classList.add("hidden");
    }
    bootstrapModal.show();
  }

  function submitForm() {
    const form = document.getElementById("rkmForm");
    if(!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    if (selectedPicsArray.length === 0) {
      alert("Pilih minimal satu PIC.");
      return;
    }

    const rowNum = document.getElementById("inpRowNum").value;
    const payload = {
      rowNum: rowNum ? parseInt(rowNum) : null,
      tanggal: document.getElementById("inpTanggal").value,
      sumber: document.getElementById("inpSumber").value,
      case: document.getElementById("inpCase").value,
      pic: selectedPicsArray.join(", "),
      target: document.getElementById("inpTarget").value,
      update: document.getElementById("inpUpdate").value,
      status: document.getElementById("inpStatus").value
    };

    const url = `${WEB_APP_URL}?action=saveRKM&currentUser=${encodeURIComponent(CURRENT_USER)}`;

    fetch(url, {
      method: "POST",
      body: JSON.stringify(payload)
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        bootstrapModal.hide();
        fetchRKMData();
      } else {
        alert(res.message);
      }
    })
    .catch(err => alert("Failed to save data to Google Sheets."));
  }

  function deleteFromModal() {
    const rowNum = document.getElementById("inpRowNum").value;
    if (!rowNum) return;

    if (!confirm("⚠️ PERINGATAN:\nApakah Anda yakin ingin menghapus agenda kerja ini secara permanen?")) {
      return;
    }

    const url = `${WEB_APP_URL}?action=deleteRKM&currentUser=${encodeURIComponent(CURRENT_USER)}`;
    
    fetch(url, {
      method: "POST",
      body: JSON.stringify({ rowNum: parseInt(rowNum) })
    })
    .then(res => res.json())
    .then(res => {
      if (res.success) {
        bootstrapModal.hide();
        fetchRKMData();
      } else {
        alert(res.message);
      }
    })
    .catch(err => alert("Failed to delete data."));
  }
</script>
</body>
</html>
